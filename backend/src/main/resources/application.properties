spring.application.name=store
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/mystore}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
# Hibernate auto-detects the PostgreSQL dialect, so this is commented out to avoid the deprecation warning.
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET:change-me-to-a-long-random-secret-key-for-local-dev-only}
app.jwt.expiration-ms=86400000
app.auth.cookie-name=AUTH_TOKEN
app.auth.cookie-secure=${AUTH_COOKIE_SECURE:auto}
app.encryption.secret=${DATA_ENCRYPTION_SECRET:change-me-to-a-long-random-data-encryption-secret-for-local-dev-only}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.mail.from=${MAIL_FROM:no-reply@aurelia.local}
